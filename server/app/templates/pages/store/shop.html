{% extends "layouts/base.html" %}
{% block page_styles %}
    <link rel="stylesheet" href="/static/css/catalog.css?v=20261015-1">
    <link rel="stylesheet" href="/static/css/gallery.css?v=20261015-1">
    <link rel="stylesheet" href="/static/css/content.css?v=20261015-1">
{% endblock %}
{% block content %}
    <section>
        <div class="shop-toolbar">
            <div>
                {% if query %}<h1 class="title">{{ query }}</h1>{% endif %}
            </div>
        </div>
        {% if products %}
            <div class="catalog-grid">
                {% for product in products %}
                    {% include "components/product/card.html" %}
                {% endfor %}
            </div>
        {% else %}
            <div class="empty">
                <h2>No products found.</h2>
            </div>
        {% endif %}
    </section>
{% endblock %}
