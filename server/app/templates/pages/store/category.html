{% extends "layouts/base.html" %}
{% block page_styles %}
    <link rel="stylesheet" href="/static/css/catalog.css?v=20261015-1">
    <link rel="stylesheet" href="/static/css/gallery.css?v=20261015-1">
    <link rel="stylesheet" href="/static/css/content.css?v=20261015-1">
{% endblock %}
{% block content %}
    <section class="page-section">
        <div class="content-width page-heading">
            <h1 class="title">{{ category.name }}</h1>
        </div>
        {% if products %}
            <div class="catalog-grid">
                {% for product in products %}
                    {% include "components/product/card.html" %}
                {% endfor %}
            </div>
        {% else %}
            <div class="empty">
                <h2>No products in this category yet.</h2>
            </div>
        {% endif %}
    </section>
{% endblock %}
