{% extends 'base.html' %}
{% block content %}
<section class="split-page"><div class="split-side"><div class="panel"><div class="kicker">Account</div><h1 class="title" style="font-size:clamp(2.8rem,7vw,6rem)">Log in</h1><p class="subtitle">Use your Velang account or continue with Google.</p></div></div><div class="split-side"><div class="panel"><form class="form" data-login-form><div class="field"><label>Email</label><input class="input" type="email" name="email" required></div><div class="field"><label>Password</label><input class="input" type="password" name="password" required></div><div class="notice" data-form-error hidden></div><button class="button" type="submit">Log in</button></form>{% if google_client_id %}<div style="margin-top:12px"><div id="g_id_onload" data-client_id="{{ google_client_id }}" data-callback="velangGoogleLogin" data-auto_prompt="false"></div><div class="g_id_signin" data-type="standard" data-theme="outline" data-size="large" data-width="100%"></div></div>{% endif %}<p class="subtitle" style="margin-top:22px">No account? <a href="/register"><u>Create one</u></a>.</p></div></div></section>{% if google_client_id %}<script src="https://accounts.google.com/gsi/client" async defer></script>{% endif %}
{% endblock %}
